<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05020b" />
    <title>WW3: New York</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05020b;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* HUD */
      .hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        padding: max(env(safe-area-inset-top), 12px)
          max(env(safe-area-inset-right), 16px)
          max(env(safe-area-inset-bottom), 12px)
          max(env(safe-area-inset-left), 16px);
        font-feature-settings: "tnum";
      }

      .hud-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        font-variant-numeric: tabular-nums;
      }

      .hud-pill {
        background: rgba(5, 2, 11, 0.55);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.05em;
      }

      .hud-score {
        color: #ffd86b;
      }

      .hud-health {
        display: flex;
        gap: 5px;
        align-items: center;
      }

      .hp-pip {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: #ef4444;
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        transition: background 0.18s, box-shadow 0.18s, transform 0.18s;
      }

      .hp-pip.off {
        background: rgba(255, 255, 255, 0.08);
        box-shadow: none;
        transform: scale(0.85);
      }

      /* Virtual joystick + fire zone */
      .touch-zones {
        position: absolute;
        inset: 0;
        display: flex;
        pointer-events: none;
      }

      .touch-zone {
        flex: 1;
        pointer-events: auto;
      }

      /* Static visible joystick — always on, bottom-left, respects safe-area */
      .joystick {
        position: absolute;
        left: calc(max(env(safe-area-inset-left), 16px) + 20px);
        bottom: calc(max(env(safe-area-inset-bottom), 16px) + 20px);
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 2px solid rgba(110, 231, 183, 0.55);
        background: radial-gradient(
          circle,
          rgba(110, 231, 183, 0.14),
          rgba(110, 231, 183, 0.04)
        );
        box-shadow: 0 0 22px rgba(110, 231, 183, 0.22),
          inset 0 0 12px rgba(110, 231, 183, 0.08);
        pointer-events: none;
        opacity: 0.75;
        transition: opacity 0.12s, transform 0.12s;
      }

      .joystick.active {
        opacity: 1;
        transform: scale(1.02);
      }

      .joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 62px;
        height: 62px;
        margin: 0;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle,
          rgba(110, 231, 183, 0.95),
          rgba(110, 231, 183, 0.4)
        );
        box-shadow: 0 0 22px rgba(110, 231, 183, 0.8),
          inset 0 0 10px rgba(255, 255, 255, 0.25);
      }

      .fire-ring {
        position: absolute;
        right: calc(max(env(safe-area-inset-right), 16px) + 28px);
        bottom: calc(max(env(safe-area-inset-bottom), 16px) + 28px);
        width: 94px;
        height: 94px;
        border-radius: 50%;
        border: 2px solid rgba(244, 114, 182, 0.55);
        background: rgba(244, 114, 182, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(244, 114, 182, 0.95);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
        pointer-events: none;
        box-shadow: 0 0 22px rgba(244, 114, 182, 0.25),
          inset 0 0 12px rgba(244, 114, 182, 0.1);
      }

      /* Death screen */
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at center,
          rgba(139, 0, 30, 0.45),
          rgba(5, 2, 11, 0.85)
        );
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        pointer-events: auto;
        animation: fadeIn 0.4s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .overlay h1 {
        font-size: 42px;
        font-weight: 900;
        margin: 0 0 8px;
        letter-spacing: 0.02em;
        color: #fff;
        text-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
      }

      .overlay p {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.7);
        margin: 0 0 28px;
      }

      .overlay .final-score {
        font-size: 56px;
        font-weight: 900;
        color: #ffd86b;
        text-shadow: 0 0 30px rgba(255, 216, 107, 0.6);
        margin-bottom: 24px;
        font-variant-numeric: tabular-nums;
      }

      .overlay .restart-btn {
        background: linear-gradient(180deg, #7c3aed, #5b21b6);
        color: #fff;
        border: none;
        padding: 14px 38px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.06em;
        cursor: pointer;
        box-shadow: 0 8px 30px rgba(124, 58, 237, 0.5);
      }

      .overlay .restart-btn:active {
        transform: scale(0.97);
      }

      /* Damage flash */
      .damage-flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at center,
          transparent 40%,
          rgba(239, 68, 68, 0.6) 100%
        );
        opacity: 0;
      }

      .damage-flash.flash {
        animation: damageFlash 0.35s ease-out;
      }

      @keyframes damageFlash {
        0% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
        }
      }


      /* ── Targeting: centre reticle, lock box on the target, status line */
      .reticle {
        position: absolute; left: 50%; top: 50%;
        width: 150px; height: 150px; margin: -75px 0 0 -75px;
        border-radius: 50%;
        border: 2px solid rgba(255, 196, 64, 0.75);
        box-shadow: 0 0 14px rgba(255, 196, 64, 0.35), inset 0 0 14px rgba(255, 196, 64, 0.15);
        pointer-events: none;
        transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      }
      .reticle::before, .reticle::after {
        content: ""; position: absolute; background: rgba(255, 196, 64, 0.85);
      }
      .reticle::before { left: 50%; top: -10px; width: 2px; height: 170px; margin-left: -1px;
        -webkit-mask: linear-gradient(#000 0 14px, transparent 14px 156px, #000 156px); mask: linear-gradient(#000 0 14px, transparent 14px 156px, #000 156px); }
      .reticle::after { top: 50%; left: -10px; height: 2px; width: 170px; margin-top: -1px;
        -webkit-mask: linear-gradient(90deg, #000 0 14px, transparent 14px 156px, #000 156px); mask: linear-gradient(90deg, #000 0 14px, transparent 14px 156px, #000 156px); }
      .reticle .dot { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255, 196, 64, 0.9); }
      .reticle .progress { position: absolute; inset: -8px; border-radius: 50%;
        background: conic-gradient(rgba(255, 196, 64, 0.9) calc(var(--p, 0) * 1turn), transparent 0);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); }
      .reticle.locked { border-color: rgba(74, 222, 128, 0.95); box-shadow: 0 0 24px rgba(74, 222, 128, 0.7), inset 0 0 18px rgba(74, 222, 128, 0.3); transform: scale(0.92); }
      .reticle.locked::before, .reticle.locked::after, .reticle.locked .dot { background: rgba(74, 222, 128, 0.95); }
      .reticle.locked .progress { background: rgba(74, 222, 128, 0.95); }
      .lock-box {
        position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; pointer-events: none;
        border: 2px solid rgba(255, 196, 64, 0.9); transform: rotate(45deg); transition: width 0.1s, height 0.1s;
      }
      .lock-box.locked { border-color: rgba(74, 222, 128, 1); box-shadow: 0 0 16px rgba(74, 222, 128, 0.8); animation: lockPulse 0.25s infinite alternate; }
      @keyframes lockPulse { from { transform: rotate(45deg) scale(1); } to { transform: rotate(45deg) scale(0.8); } }
      .lock-label {
        position: absolute; left: 50%; top: calc(50% + 92px); transform: translateX(-50%);
        font-size: 13px; font-weight: 800; letter-spacing: 0.3em; color: rgba(255, 196, 64, 0.95);
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.6); pointer-events: none; white-space: nowrap;
      }
      .lock-label.locked { color: rgba(74, 222, 128, 1); }
      .flight-data {
        position: absolute; left: 50%; bottom: calc(max(env(safe-area-inset-bottom), 12px) + 8px); transform: translateX(-50%);
        display: flex; gap: 22px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.9); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); pointer-events: none;
        font-variant-numeric: tabular-nums;
      }
      .flight-data b { color: #ffd86b; }
      .warning {
        position: absolute; left: 50%; top: 22%; transform: translateX(-50%);
        font-size: 18px; font-weight: 900; letter-spacing: 0.25em; color: #ff4d4d;
        text-shadow: 0 0 14px rgba(255, 0, 0, 0.6); pointer-events: none; animation: blink 0.5s infinite alternate;
      }
      @keyframes blink { from { opacity: 1; } to { opacity: 0.35; } }
      .kill-feed { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); pointer-events: none; text-align: center; }
      .kill-feed div {
        font-size: 20px; font-weight: 900; letter-spacing: 0.15em; color: #ffd86b;
        text-shadow: 0 0 16px rgba(255, 150, 0, 0.8); animation: killPop 1.6s ease-out forwards;
      }
      @keyframes killPop { 0% { opacity: 0; transform: scale(1.6); } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
      .missile-btn {
        position: absolute;
        right: calc(max(env(safe-area-inset-right), 16px) + 136px);
        bottom: calc(max(env(safe-area-inset-bottom), 16px) + 40px);
        width: 72px; height: 72px; border-radius: 50%;
        border: 2px solid rgba(74, 222, 128, 0.6); background: rgba(74, 222, 128, 0.12);
        color: rgba(74, 222, 128, 0.95); font-size: 11px; font-weight: 800; letter-spacing: 0.14em;
        display: flex; align-items: center; justify-content: center; z-index: 5; user-select: none; cursor: pointer;
      }
      .missile-btn.cooling { opacity: 0.35; }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div class="hud">
        <div class="hud-top">
          <div class="hud-pill hud-score">SCORE <span id="score">0</span></div>
          <div class="hud-pill hud-health" id="health">
            <div class="hp-pip"></div>
            <div class="hp-pip"></div>
            <div class="hp-pip"></div>
            <div class="hp-pip"></div>
            <div class="hp-pip"></div>
          </div>
        </div>
      </div>
      <div class="touch-zones">
        <div class="touch-zone" id="zone-left"></div>
        <div class="touch-zone" id="zone-right"></div>
      </div>
      <div class="joystick" id="joystick">
        <div class="joystick-knob" id="joystick-knob"></div>
      </div>
      <div class="fire-ring">FIRE</div>
      <div class="reticle" id="reticle"><div class="progress"></div><div class="dot"></div></div>
      <div class="lock-box hidden" id="lock-box"></div>
      <div class="lock-label" id="lock-label"></div>
      <div class="warning hidden" id="warning"></div>
      <div class="kill-feed" id="kill-feed"></div>
      <div class="flight-data"><span>ALT <b id="alt">0</b></span><span>SPD <b id="spd">0</b></span><span>MSL <b id="msl">READY</b></span><span>KILLS <b id="kills">0</b></span></div>
      <div class="missile-btn" id="missile-btn">MSL</div>
      <div class="damage-flash" id="damage-flash"></div>
      <div class="overlay hidden" id="death-screen">
        <h1>SHOT DOWN</h1>
        <p>Final score</p>
        <div class="final-score" id="final-score">0</div>
        <button class="restart-btn" id="restart-btn">FLY AGAIN</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
